name: Install M24 logo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-m24-logo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update website header logo
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old_css = '.brand{display:flex;align-items:center;gap:10px;font-weight:950;font-size:24px;letter-spacing:-.5px}.logo{width:40px;height:40px;border-radius:13px;background:linear-gradient(145deg,#2563eb,#63a2ff);display:grid;place-items:center;color:#fff;font-weight:950;box-shadow:0 9px 22px rgba(37,99,235,.28)}.brand b{color:var(--brand)}'
          new_css = '.brand{display:flex;align-items:center;text-decoration:none}.brandLogo{display:block;width:250px;height:auto;max-height:62px;object-fit:contain}@media(max-width:700px){.brandLogo{width:185px;max-height:52px}}'
          old_header = '<div class="brand"><div class="logo"></div><div>meinauftrag<b>24</b></div></div>'
          new_header = '<div class="brand" data-go="home"><img class="brandLogo" src="assets/m24-logo-header.svg" alt="MeinAuftrag24"></div>'
          if old_css not in s:
              raise SystemExit('Old logo CSS not found')
          if old_header not in s:
              raise SystemExit('Old header logo markup not found')
          s = s.replace(old_css, new_css, 1)
          s = s.replace(old_header, new_header, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit logo integration
        run: |
          git config user.name "MeinAuftrag24 Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Show M24 logo in website header"
          git push
